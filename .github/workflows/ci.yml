# push とプルリクエストのたびに、lint・整形のチェック・テストを自動で実行する。
name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

# 読み取りだけで十分（リポジトリへの書き込みはしない）
permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint / 整形
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      - name: lint（ruff check）
        run: ruff check . --output-format=github

      - name: 整形（ruff format --check）
        run: ruff format --check .

  test:
    name: テスト (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の requires-python（3.12 以上）の最小と、開発で使っている版
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # 画面の JavaScript の文法チェック（tests/unit/test_frontend_syntax.py）に使う
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      # 画面の自動テスト（tests/e2e）はブラウザが必要なので、下の e2e ジョブで実行する
      - name: テスト（カバレッジ 90% 未満なら失敗）
        run: >-
          pytest -m "not e2e"
          --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  e2e:
    name: 画面の自動テスト（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      - name: テスト用ブラウザ（Chromium）のインストール
        run: python -m playwright install --with-deps chromium

      - name: 画面の自動テスト
        # 失敗したテストは画面のスクリーンショットと操作の記録（trace）を残す
        run: pytest -m e2e --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results

      - name: 失敗したときの記録を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
