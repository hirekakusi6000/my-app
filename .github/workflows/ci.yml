# push とプルリクエストのたびに、lint・整形のチェック・テストを自動で実行する。
name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

# 読み取りだけで十分（リポジトリへの書き込みはしない）
permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint / 整形
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      - name: lint（ruff check）
        run: ruff check . --output-format=github

      - name: 整形（ruff format --check）
        run: ruff format --check .

  test:
    name: テスト (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の requires-python（3.12 以上）の最小と、開発で使っている版
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # 画面の JavaScript の文法チェック（tests/unit/test_frontend_syntax.py）に使う
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存ライブラリのインストール
        run: pip install -r requirements-dev.txt

      - name: テスト（カバレッジ 90% 未満なら失敗）
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
